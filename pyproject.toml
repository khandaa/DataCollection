[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "data-collection-ingestion"
version = "0.1.0"
description = "Local Phase I Indian market data ingestion engine"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "httpx>=0.27,<1",
    "SQLAlchemy>=2.0,<3",
    "PyMySQL>=1.1,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["indian_market*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
